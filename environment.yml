name: gnn
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python>=3.11,<3.14
  - pytorch>=2.6
  - pytorch-cuda>=12.4
  - numpy>=2.0
  - pyyaml>=6.0
  - scipy>=1.15
  - scikit-learn>=1.6
  - matplotlib>=3.10
  - xgboost>=3.0
  # Only `pathwaygnn-data tr-build-processed` needs this, to read the LINCS
  # Level 5 GCTX (HDF5) matrix. Also available as the `tr-upstream` extra.
  - h5py>=3.11
  - pytest>=8.3
  - pip
  - pip:
      - torch-geometric>=2.6
      - mygene>=3.2
      # `pathwaygnn hg` and resolving an `hf://` checkpoint reference. Also the
      # `hub` extra; `dry_run: true` stages an upload without it.
      - huggingface-hub>=0.34
      - -e .

