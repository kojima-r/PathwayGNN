defaults:
  - dataset.yaml

seed: 42
device: auto
folds: 5

dataset:
  tasks: [kd_inh, oe_act]

pretrained_checkpoint: outputs/tr/pretrain/best.pt

model:
  hidden_dim: 64
  dropout: 0.2
  block: plain
  batch_norm: false

training:
  epochs: 50
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  shuffle: true
  end_to_end: false
  loss_reduction: mean
  # Same loss as `finetune`: negatives/positives of the fold's training split.
  # Without it the 8.2% positive rate collapses kd_inh onto the majority class.
  pos_weight: auto
  scheduler_patience: 10
  selection: final_epoch
  resume: true

# Same four ablations as the cancer grid; `use_covariates` is unavailable here
# because the target-repositioning tasks carry no covariates.
variants:
  - {name: mlp, use_graph: false, use_covariates: false, seed_index: 0}
  - {name: gnn_mlp, use_graph: true, use_covariates: false, seed_index: 1}

output_dir: outputs/tr/cv
