# Graph-free baselines on exactly the same features the GNN sees: every
# node-level feature expanded to [samples, 20] and hstacked with the four
# sample-level features. Needs `pip install -e '.[benchmark]'`.
defaults:
  - dataset.yaml

seed: 42
device: cpu

dataset:
  task: responder

folds: 3
n_jobs: -1
logistic_regression: {C: 1.0}
random_forest: {n_estimators: 100, max_depth: null}
xgboost: {enabled: true, n_estimators: 100, max_depth: 3, learning_rate: 0.1, subsample: 0.8}
output_dir: outputs/sample/benchmark/responder
