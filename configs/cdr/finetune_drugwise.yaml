defaults:
  - dataset.yaml

seed: 42
device: auto

dataset:
  task: sensitive_drugwise

split: [0.7, 0.15, 0.15]
pretrained_checkpoint: outputs/cdr/pretrain/best.pt

variant:
  use_graph: true
  use_sample_features: true

model:
  hidden_dim: 64
  dropout: 0.2
  block: plain

training:
  epochs: 40
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 8
  patience: 8
  train_encoder: false

output_dir: outputs/cdr/finetune/sensitive_drugwise
