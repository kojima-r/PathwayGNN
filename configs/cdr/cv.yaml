defaults:
  - dataset.yaml

seed: 42
device: auto
folds: 5

dataset:
  tasks: [sensitive_drugwise, sensitive_global]

pretrained_checkpoint: outputs/cdr/pretrain/best.pt

model:
  hidden_dim: 64
  dropout: 0.2
  block: plain
  batch_norm: false

training:
  epochs: 30
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 8
  shuffle: true
  # The encoder is frozen, so its 356-relation forward runs once per fold
  # instead of once per step.
  end_to_end: false
  loss_reduction: mean
  scheduler_patience: 5
  selection: final_epoch
  resume: true

# The cancer grid's four ablations. `use_sample_features` switches the compound
# fingerprint and the mutational spectra on; without it a sample is only the
# cell line's mutated genes, which is what isolates the graph's contribution.
variants:
  - {name: mlp, use_graph: false, use_sample_features: false, seed_index: 0}
  - {name: mlp_cov, use_graph: false, use_sample_features: true, seed_index: 1}
  - {name: gnn_mlp, use_graph: true, use_sample_features: false, seed_index: 2}
  - {name: gnn_mlp_cov, use_graph: true, use_sample_features: true, seed_index: 3}

output_dir: outputs/cdr/cv
